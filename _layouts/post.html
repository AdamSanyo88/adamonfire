---
layout: default
---

<div class="container">
  <div class="section">

    <article class="post"
             itemscope
             itemtype="http://schema.org/BlogPosting">

      <div class="post-content" itemprop="articleBody">
        {{ content }}
      </div>

      {% if site.disqus.shortname %}
        {% include disqus_comments.html %}
      {% endif %}

    </article>

  </div>
</div>

<script>
  $('.carousel.carousel-slider').carousel({
    fullWidth: true
  });
</script>
